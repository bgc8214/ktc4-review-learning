<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>시스템 타이쿤 · 한 장의 지도로 배우는 백엔드</title>
 <link rel="stylesheet" href="./tokens.css">
 <link rel="stylesheet" href="./game.css">
</head>
<body>
 <header class="topbar">
  <a class="brand" href="./game.html"><span class="brand-mark"></span><span>System<span>Tycoon</span></span></a>
  <div class="hud"><span><small>본 정류장</small><b id="seenCount">1 / 10</b></span><span><small>현재 장면</small><b id="layerName">안전한 흐름</b></span><span><small>운반 중</small><b id="cargo">로그인 요청</b></span></div>
  <a class="notes" href="./">리뷰 학습 노트</a><button id="guideToggle">가이드 숨기기</button>
 </header>
 <main class="tycoon-shell">
  <section class="stage" aria-label="선택한 개념의 과정 지도">
   <canvas id="park" role="img" aria-label="개념의 실행 흐름을 정류장별로 보여주는 등각 투영 지도"></canvas>
   <div class="map-title"><label for="conceptSelect">학습 지도</label><select id="conceptSelect"></select><b id="mapSubtitle"></b></div>
   <div class="zoom"><button id="zoomIn" aria-label="확대">+</button><button id="zoomOut" aria-label="축소">−</button><button id="zoomFit" aria-label="지도 전체 보기">↗</button></div>
   <div class="map-help">정류장을 누르면 이동 · 드래그로 지도 이동 · 휠로 확대</div>
  </section>
  <aside class="guide" id="guide">
   <div class="stop-kicker"><span id="stopNo">STOP 1 OF 10</span><button id="guideClose" aria-label="가이드 닫기">×</button></div>
   <p class="concept-name" id="conceptName"></p><h1 id="title"></h1><p class="lead" id="summary"></p>
   <div class="progress" aria-hidden="true"><i id="progressBar"></i></div><p class="reading-stop">차량이 이곳에 멈췄습니다. 노란 표시를 지도에서 찾고 설명을 읽어보세요.</p>
   <section class="watch"><h2>지금 지도에서 볼 것</h2><p id="observe"></p></section>
   <section class="state-board"><div><h2>현재 상태</h2><label for="scenarioSelect">비교 장면</label></div><select id="scenarioSelect"></select><dl id="state"></dl></section>
   <section class="explanation"><h2>왜 이런 일이 생기나요?</h2><div id="detail"></div></section>
   <section class="code-card"><h2>코드로 보면</h2><pre><code id="code"></code></pre></section>
   <aside class="pitfall"><strong>헷갈리기 쉬운 지점</strong><p id="pitfall"></p></aside>
   <details class="sources"><summary>학생 PR 질문과 더 읽을 자료</summary><div id="sources"></div></details>
   <section class="route"><h2>이 지도의 전체 과정 <small>정류장을 눌러 바로 이동</small></h2><nav id="stops" aria-label="전체 정류장"></nav></section>
  </aside>
  <footer class="dock"><button id="previous" aria-label="이전 정류장">←</button><button id="play" aria-label="자동 재생">▶</button><button id="next" aria-label="다음 정류장">다음 정류장 →</button><button id="restart" aria-label="현재 지도 처음부터">⟲</button><label>속도 <input id="speed" type="range" min="0.5" max="2" step="0.5" value="1"><output id="speedOut">1×</output></label><label><input id="follow" type="checkbox" checked> 차량 따라가기</label><label><input id="signs" type="checkbox" checked> 정류장 간판</label></footer>
 </main>
 <script type="module" src="./game.js"></script>
</body>
</html>
